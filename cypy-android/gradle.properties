# 4 GB swap aktif di /swapfile (swappiness=10), jadi heap boleh jauh lebih lega
# daripada saat mesin ini benar-benar cuma punya 1,9 GB RAM tanpa swap.
org.gradle.jvmargs=-Xmx1600m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC -XX:MaxRAMPercentage=75
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.daemon=false
org.gradle.workers.max=2
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.incremental=true
kotlin.compiler.execution.strategy=in-process
android.defaults.buildfeatures.buildconfig=true
